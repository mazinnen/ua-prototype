<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101a2a" />
    <meta name="description" content="デッキを組んで、いつでも一人回し。ユニオンアリーナの非公式プレイテストツール。" />
    <title>UNION DECK LAB — デッキを組んで、一人回し。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="UNION DECK LAB ホーム">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>UNION</strong><small>DECK LAB</small></span>
        </a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="メインメニュー">
          <button class="nav-item active" data-view="decks"><span class="nav-icon">▤</span>デッキ一覧</button>
          <button class="nav-item" data-view="builder"><span class="nav-icon">＋</span>デッキを作る</button>
          <button class="nav-item" data-view="play"><span class="nav-icon">▷</span>一人回し</button>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">MY DECKS <span id="sidebar-deck-count">0</span></div>
        <div id="sidebar-decks" class="sidebar-decks"></div>
        <div class="sidebar-footer">
          <div class="footer-badge">✦</div>
          <div><strong>思考を、プレイに。</strong><p>自分のペースで試そう。</p></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>WORKSPACE</span><i>/</i><strong id="breadcrumb-current">デッキ一覧</strong></div>
          <div class="topbar-right"><span class="local-status"><i></i>この端末に保存</span><span class="avatar">U</span></div>
        </header>
        <section id="view-decks" class="view active"></section>
        <section id="view-builder" class="view"></section>
        <section id="view-play" class="view"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
